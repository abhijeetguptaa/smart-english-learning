    <h1>Privacy Policy</h1>
    <p><strong>Last updated:</strong> May 2026</p>

    <p>
      This Privacy Policy describes how <strong>Smart English Learning</strong>
      (“we”, “our”, or “us”) handles information when you use our mobile application. Our app is
      designed for English practice and general learning activities for all users, including students and lifelong learners of all ages.
    </p>

    <h2>1. Information We Collect</h2>
    <p>
      We <strong>do not collect, store, or share any personal information</strong> from users.
    </p>
    <ul>
      <li>No name, email address, or phone number is collected.</li>
      <li>No precise location data is collected.</li>
      <li>No contacts, photos, or personal files are accessed.</li>
    </ul>

    <h2>2. Target Audience & Age Verification</h2>
    <p>
      Smart English Learning is intended for a general audience, including students, professionals, and lifelong learners of all ages. To comply with global app store policies and ensure a safe experience for everyone, we implement a <strong>Neutral Age Screen</strong> upon first use. This screen helps us verify the user's age category to provide appropriate settings and content. We do not store the exact age, only the verified status locally on the device.
    </p>

    <h2>3. Advertising</h2>
    <p>
      Our app may display advertisements provided by <strong>Google AdMob</strong>. These ads are
      configured to be:
    </p>
    <ul>
      <li><strong>Non-personalized</strong></li>
      <li>Rated for general audiences</li>
    </ul>

    <p>AdMob may collect limited anonymous technical data such as:</p>
    <ul>
      <li>Device type and operating system</li>
      <li>Basic interaction data for ad performance</li>
    </ul>

    <p>
      This data is used only to provide non-personalized ads and
      <strong>cannot be used to identify an individual user</strong>.
    </p>

    <h2>3. Third-Party Services</h2>
    <p>The app uses the following third-party service:</p>
    <ul>
      <li>Google AdMob – for displaying advertisements</li>
    </ul>

    <p>
      You can review Google’s privacy policy here:
      <br />
      <a href="https://policies.google.com/privacy" target="_blank">
        https://policies.google.com/privacy
      </a>
    </p>

    <h2>4. User Privacy</h2>
    <p>Since we do not collect personal information, no personal profile is created.</p>

    <h2>5. Data Security</h2>
    <p>
      Because no personal data is collected or stored, there is no risk of personal data misuse from
      our application.
    </p>

    <h2>6. Changes to This Privacy Policy</h2>
    <p>
      We may update this Privacy Policy from time to time. Any changes will be posted on this page
      with an updated revision date.
    </p>

    <h2>7. Contact Us</h2>
    <p>If you have any questions about this Privacy Policy, you may contact us at:</p>
    <p><strong>Email:</strong> smarter.learning.app@gmail.com</p>
